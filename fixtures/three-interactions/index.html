<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture — Three.js + interactions</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #07060b; color: #efeaf7; font-family: Helvetica, Arial, sans-serif; }
  canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 72px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; z-index: 20; }
  .burger { width: 56px; height: 40px; border: 1px solid #efeaf7; background: transparent; color: #efeaf7; border-radius: 20px; cursor: pointer; }
  .menu { position: fixed; inset: 0; z-index: 15; background: #1a0f2e; display: grid; place-items: center; font-size: 64px; opacity: 0; visibility: hidden; transform: translateY(-4%); transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s 0.6s; }
  .menu.is-open { opacity: 1; visibility: visible; transform: none; transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
  main { position: relative; z-index: 1; }
  section { min-height: 100vh; padding: 140px 8vw; }
  h1 { font-size: 8vw; font-weight: 300; }
  .hold { margin-top: 40px; padding: 22px 48px; border-radius: 999px; border: 0; background: #efeaf7; color: #07060b; font-size: 18px; cursor: pointer; transition: transform 0.2s ease-out, background-color 0.2s ease-out; }
  .hold:active { transform: scale(0.94); background-color: #b18cff; }
  .acc { margin-top: 40px; max-width: 640px; border-top: 1px solid #3a3150; }
  .acc button { width: 100%; text-align: left; padding: 24px 0; background: none; border: 0; color: inherit; font-size: 24px; cursor: pointer; }
  .acc .panel { overflow: hidden; height: 0; transition: height 0.45s cubic-bezier(0.65, 0, 0.35, 1); }
  .acc .panel p { padding-bottom: 24px; color: #b9b2c8; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<header><span>Orbit</span><button class="burger" aria-label="Menu" aria-expanded="false" aria-controls="site-menu">≡</button></header>
<nav class="menu" id="site-menu"><ul style="list-style:none"><li>Work</li><li>Studio</li><li>Contact</li></ul></nav>
<main>
  <section id="hero"><h1>Orbital design</h1><button class="hold">Hold to explore</button></section>
  <section id="details">
    <h2 style="font-size:48px;font-weight:300">Details</h2>
    <div class="acc"><button aria-expanded="false" aria-controls="panel-1">What we do</button><div class="panel" id="panel-1"><p>Immersive websites with real-time 3D.</p></div></div>
  </section>
  <section id="more"><h2 style="font-size:48px;font-weight:300">More</h2></section>
  <section id="end"><h2 style="font-size:48px;font-weight:300">End</h2></section>
</main>
<script type="module">
  import * as THREE from '../vendor/three.module.min.js';
  const canvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(1);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x07060b, 4, 12);
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6);
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const light = new THREE.DirectionalLight(0xb18cff, 2.5);
  light.position.set(3, 4, 5);
  scene.add(light);
  const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.32, 160, 24), new THREE.MeshStandardMaterial({ color: 0x8a5cff, roughness: 0.35, metalness: 0.4 }));
  knot.name = 'hero-knot';
  scene.add(knot);
  const floaters = new THREE.Group();
  floaters.name = 'floaters';
  for (let i = 0; i < 6; i++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshStandardMaterial({ color: 0xefeaf7 }));
    s.position.set(Math.cos(i) * 2.4, Math.sin(i * 1.7) * 1.4, Math.sin(i) * 0.8);
    floaters.add(s);
  }
  scene.add(floaters);
  // custom geometry (not parametric): exported by DIP as a study .glb
  const gemGeo = new THREE.BufferGeometry();
  gemGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0.5, 0, -0.3, 0, 0.3, 0.3, 0, 0.3, 0.3, 0, -0.3, -0.3, 0, -0.3, 0, -0.5, 0], 3));
  gemGeo.setIndex([0, 1, 2, 0, 2, 3, 0, 3, 4, 0, 4, 1, 5, 2, 1, 5, 3, 2, 5, 4, 3, 5, 1, 4]);
  gemGeo.computeVertexNormals();
  const gem = new THREE.Mesh(gemGeo, new THREE.MeshStandardMaterial({ color: 0x3fd0c9, roughness: 0.2, metalness: 0.6 }));
  gem.name = 'gem';
  gem.position.set(-2.6, 1.2, -1);
  scene.add(gem);
  const pointer = { x: 0, y: 0 };
  addEventListener('pointermove', (e) => { pointer.x = (e.clientX / innerWidth) * 2 - 1; pointer.y = (e.clientY / innerHeight) * 2 - 1; });
  let last = performance.now();
  function frame(now) {
    const dt = (now - last) / 1000; last = now;
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    knot.rotation.y += 0.5 * dt;                       // loop: 0.5 rad/s
    floaters.position.x += (pointer.x * 0.6 - floaters.position.x) * 0.08;   // mouse parallax
    floaters.position.y += (-pointer.y * 0.4 - floaters.position.y) * 0.08;
    const max = document.documentElement.scrollHeight - innerHeight;
    const p = max > 0 ? scrollY / max : 0;             // camera path scrubbed by the scroll
    camera.position.z = 6 - 4 * p;
    camera.position.y = -1.5 * p;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const burger = document.querySelector('.burger'), menu = document.getElementById('site-menu');
  burger.addEventListener('click', () => {
    const open = burger.getAttribute('aria-expanded') !== 'true';
    burger.setAttribute('aria-expanded', String(open));
    menu.classList.toggle('is-open', open);
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') { burger.setAttribute('aria-expanded', 'false'); menu.classList.remove('is-open'); } });
  const accBtn = document.querySelector('.acc button'), panel = document.getElementById('panel-1');
  accBtn.addEventListener('click', () => {
    const open = accBtn.getAttribute('aria-expanded') !== 'true';
    accBtn.setAttribute('aria-expanded', String(open));
    panel.style.height = open ? panel.scrollHeight + 'px' : '0px';
  });
</script>
</body>
</html>
